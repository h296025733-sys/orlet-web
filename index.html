<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>Orlet</title>
  <meta name="application-name" content="Orlet">
  <meta name="theme-color" content="#f1f3f4">
  <link rel="icon" href="./mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css?v=88a199b550a2">
  <link rel="stylesheet" href="./reader-shell.css?v=5548d88927e0">
  <link rel="stylesheet" href="./typography.css?v=fb0a954a3d1c">
  <link rel="stylesheet" href="./quote-overlay.css?v=6fed12698ee4">
  <link rel="stylesheet" href="./filter-bar.css?v=8b1f8e3db3f9">
  <script type="module" src="./quote-overlay.js?v=b46188669aa9"></script>
<script src="./backend-bridge.js?v=98bfec9c4923"></script>
  <script type="module" src="./share-client.js?v=332512484a5d"></script>
  <script type="module" src="./app.js?v=86f8f7be3851"></script>
</head>
<body>
  <svg class="svg-symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="icon-feed" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 9h8M8 13h8M8 17h5"/></symbol>
    <symbol id="icon-unread" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="3"/><path d="m5 7 7 6 7-6"/></symbol>
    <symbol id="icon-star" viewBox="0 0 24 24"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3l-5.6 2.9 1.1-6.2L3 9.6l6.2-.9Z"/></symbol>
    <symbol id="icon-sources" viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1.5"/><rect x="14" y="4" width="6" height="6" rx="1.5"/><rect x="4" y="14" width="6" height="6" rx="1.5"/><path d="M17 14v6m-3-3h6"/></symbol>
    <symbol id="icon-history" viewBox="0 0 24 24"><path d="M4.5 8a8 8 0 1 1-.1 8M4 4v5h5m3-2v5l3 2"/></symbol>
    <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></symbol>
    <symbol id="icon-calendar" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M8 3v4m8-4v4M4 10h16M8 14h2m4 0h2"/></symbol>
    <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="icon-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24"><path d="m9 3-1 3-3 1-2 5 2 5 3 1 1 3h6l1-3 3-1 2-5-2-5-3-1-1-3Z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="icon-update" viewBox="0 0 24 24"><path d="M4 11a8 8 0 0 1 14-5l2 2M20 3v5h-5M20 13a8 8 0 0 1-14 5l-2-2M4 21v-5h5"/></symbol>
  </svg>

  <aside class="sidebar" id="sidebar" aria-label="阅读导航">
    <div class="sidebar-heading"><span>Orlet</span><button id="nav-close" class="icon-button" aria-label="收起导航">×</button></div>
    <div class="sidebar-scroll">
      <nav class="reading-nav" aria-label="工作区">
        <button class="nav-item active" data-workspace="feed" aria-pressed="true"><svg class="nav-icon" aria-hidden="true"><use href="#icon-feed"/></svg><span>内容</span><span class="new-content-dot" id="new-content-dot" title="有内容更新" hidden></span><span class="nav-count" id="nav-total">0</span></button>
        <button class="nav-item" data-workspace="sources" aria-pressed="false"><svg class="nav-icon" aria-hidden="true"><use href="#icon-sources"/></svg><span>监控</span></button>
      </nav>
      <nav class="nav-section" aria-label="作者">
        <div class="nav-section-heading"><span>关注来源 <span id="authors-count"></span></span><button id="author-add" title="添加作者" aria-label="添加作者">+</button></div>
        <div id="author-list"></div>
      </nav>
    </div>
    <nav class="manage-nav" aria-label="管理">
      <button class="nav-item" data-view="activity"><svg class="nav-icon" aria-hidden="true"><use href="#icon-history"/></svg><span>最近记录</span></button>
    </nav>
  </aside>
  <button class="nav-backdrop" id="nav-backdrop" aria-label="收起导航" tabindex="-1" hidden></button>

  <div class="shell">
    <header class="topbar">
      <button class="mobile-nav-toggle" id="nav-toggle" aria-label="展开导航" aria-controls="sidebar" aria-expanded="false"><svg class="nav-icon" aria-hidden="true"><use href="#icon-menu"/></svg></button>
      <a class="brand" href="./" aria-label="Orlet 首页"><img src="./mark.svg" alt="" width="30" height="30" fetchpriority="high"><span>Orlet</span></a>
      <div class="breadcrumbs"><span id="breadcrumb-title">全部动态</span></div>
      <div class="top-actions">
        <label class="workspace-search" id="workspace-search"><svg class="button-icon" aria-hidden="true"><use href="#icon-search"/></svg><input id="search" type="search" placeholder="搜索内容或作者" aria-label="搜索内容或作者" maxlength="100"><span class="search-shortcut" aria-hidden="true">/</span></label>
        <button class="connection-control" id="setup-open" aria-label="连接设置"><span class="connection-dot" id="connection-dot"></span><span id="connection-title">未连接</span><svg class="button-icon" aria-hidden="true"><use href="#icon-settings"/></svg></button>
      </div>
    </header>
    <main>
      <div class="workspace-heading">
      <div id="content-controls" class="content-controls"><nav class="content-tabs" aria-label="内容视图">
        <button id="content-all" class="content-tab active" data-content="all" aria-pressed="true">全部</button>
        <button id="unread-chip" class="content-tab" data-content="unread" aria-pressed="false">未读<span class="period-count" id="period-count-unread"></span></button>
        <button id="content-saved" class="content-tab" data-content="starred" aria-pressed="false"><svg class="button-icon" aria-hidden="true"><use href="#icon-star"/></svg>收藏</button>
      </nav></div>
      <div class="page-title" id="page-title">
        <div><h1 id="page-heading">全部动态</h1><p class="page-subtitle" id="page-subtitle"></p></div>
        <button class="primary" id="add-open"><svg class="button-icon" aria-hidden="true"><use href="#icon-plus"/></svg>添加订阅</button>
      </div>
      </div>
      <div class="filter-toolbar">
      <nav class="workspace-platforms" id="workspace-platforms" aria-label="平台">
        <button class="platform-nav active" data-platform="">全部</button>
        <button class="platform-nav" data-platform="wechat">公众号<span class="nav-count" id="count-wechat"></span></button>
        <button class="platform-nav" data-platform="xiaohongshu">小红书<span class="nav-count" id="count-xiaohongshu"></span></button>
        <button class="platform-nav" data-platform="x">X<span class="nav-count" id="count-x"></span></button>
      </nav>
        <div class="panel-toolbar filter-row" id="feed-filters">
          <div class="period-tabs" aria-label="日期筛选（北京时间）" title="北京时间">
            <button class="period-tab active" data-tab="today" aria-pressed="true">今天<span class="period-count" id="period-count-today"></span></button>
            <button class="period-tab" data-tab="all" aria-pressed="false">全部日期</button>
            <button class="period-tab" data-tab="range" aria-pressed="false" aria-expanded="false" aria-controls="range-panel" id="range-tab"><svg class="button-icon" aria-hidden="true"><use href="#icon-calendar"/></svg>日期<span class="period-count" id="range-label"></span></button>
          </div>
          <div class="range-panel" id="range-panel" role="group" aria-label="选择日期范围" hidden>
            <div class="range-panel-heading"><strong>选择日期</strong><button type="button" id="range-close" aria-label="关闭日期选择">×</button></div>
            <div class="range-presets" role="group" aria-label="快捷范围">
              <button type="button" class="range-preset" data-range-days="1">今天</button>
              <button type="button" class="range-preset" data-range-days="7">近 7 天</button>
              <button type="button" class="range-preset" data-range-days="30">近 30 天</button>
            </div>
            <div class="range-fields">
              <label class="range-field"><span>开始</span><input type="date" id="range-from"></label>
              <span class="range-dash" aria-hidden="true">—</span>
              <label class="range-field"><span>结束</span><input type="date" id="range-to"></label>
            </div>
            <div class="range-actions">
              <button type="button" class="secondary" id="range-clear">清除</button>
              <button type="button" class="primary" id="range-apply">应用</button>
            </div>
          </div>
        </div>
      </div>
      <section class="content-panel" id="feed-view" aria-label="内容列表">
        <div class="feed-meta"><span id="feed-count"></span><button class="text-button" id="read-all" disabled>本区域标为已读</button><span class="timezone-label">北京时间</span></div>
        <div class="updates-notice" id="updates-notice" role="status" hidden><span><svg class="button-icon" aria-hidden="true"><use href="#icon-update"/></svg><span id="updates-label"></span></span><button id="updates-apply">查看更新</button></div>
        <div id="articles" class="articles"></div>
        <div class="empty-state" id="feed-empty"><div class="empty-symbol"><svg class="nav-icon" aria-hidden="true"><use href="#icon-feed"/></svg></div><p id="empty-title">这里还没有内容</p><p class="empty-description" id="empty-description"></p><button class="text-button" id="search-history" hidden>查看历史结果 →</button></div>
        <button class="secondary load-more" id="load-more" hidden>加载更多</button>
      </section>
      <section class="content-panel" id="sources-view" aria-label="我的监控" hidden><div id="sources-list"></div></section>
      <section class="content-panel" id="activity-view" hidden><div id="events-list"></div></section>
      <section id="library-view" class="library-view" aria-label="收藏资料库" hidden>
        <div class="library-toolbar"><div class="library-kinds"><button id="library-kind-articles" aria-pressed="true">文章收藏</button><button id="library-kind-quotes" aria-pressed="false">语录收藏</button></div><label class="sr-only" for="library-tag-filter">筛选标签</label><select id="library-tag-filter"><option value="">全部标签</option></select><button class="text-button" id="library-tags-manage">管理标签</button></div>
        <p id="library-status" class="library-status" role="status"></p><div id="library-list" class="library-list"></div><p id="library-empty" class="empty-state" hidden></p><button id="library-more" class="secondary" hidden>加载更多</button>
      </section>
      <section class="reader-view" id="reader-view" aria-label="原文阅读" tabindex="-1" hidden>
        <div class="reader-toolbar">
          <div class="reader-navigation" role="group" aria-label="阅读导航">
            <button class="text-button" id="reader-back" title="返回列表 · Esc">← 返回列表</button>
            <div class="reader-pagination" role="group" aria-label="文章翻页"><button id="reader-prev" aria-label="上一篇" title="上一篇 · ←" disabled>‹</button><button id="reader-next" aria-label="下一篇" title="下一篇 · →" disabled>›</button></div>
            <a class="text-button reader-source-link" id="reader-source" target="_blank" rel="noopener noreferrer" aria-label="在原网站查看文章" hidden>原文 ↗</a>
          </div>
          <div class="reader-actions" role="group" aria-label="文章操作">
            <button class="text-button" id="reader-star" aria-pressed="false">☆ 收藏</button>
            <button class="text-button" id="reader-analysis" hidden>AI 分析</button>
            <button class="text-button" id="reader-read">标为未读</button>
          </div>
        </div>
        <article class="reader-article">
          <h1 id="reader-title" tabindex="-1"></h1>
          <div class="reader-status" id="reader-status" role="status"></div>
          <div class="reader-content" id="reader-content"></div>
          <button id="quote-save" class="quote-save" type="button" hidden>划线收藏</button>
          <div class="reader-retry" id="reader-retry-wrap" hidden><button class="secondary" id="reader-retry">重试</button></div>
        </article>
      </section>
      <div class="sr-only" aria-hidden="true"><span id="metric-sources">0</span><span id="metric-unread">0</span><span id="metric-today">0</span><span id="attention-stat" hidden><span id="metric-attention">0</span></span><div hidden><button data-filter=""></button><button data-filter="x"></button><button data-filter="xiaohongshu"></button><button data-filter="wechat"></button></div></div>
      <span class="sr-only" id="refresh-status" role="status"></span>
    </main>
  </div>

  <dialog id="analysis-dialog" class="analysis-dialog" aria-labelledby="analysis-heading">
    <div class="dialog-title"><h2 id="analysis-heading">AI 分析</h2><button type="button" class="icon-button" id="analysis-close" aria-label="关闭分析">×</button></div>
    <p id="analysis-title" class="analysis-title"></p><p id="analysis-status" role="status"></p><div id="analysis-result" class="analysis-result"></div><p id="analysis-coverage" class="analysis-coverage" hidden></p><button id="analysis-retry" class="secondary" type="button" hidden>重试</button>
  </dialog>
  <dialog id="library-tag-dialog">
    <div class="dialog-title"><h2>设置标签</h2><button type="button" class="icon-button" data-close="library-tag-dialog" aria-label="关闭">×</button></div>
    <div id="library-tag-options" class="tag-options"></div><div class="tag-create"><label class="sr-only" for="library-tag-name">新标签名称</label><input id="library-tag-name" maxlength="60" placeholder="新标签"><button type="button" id="library-tag-create" class="secondary">添加</button></div>
    <p id="library-tag-error" class="form-error" role="status"></p><div class="dialog-actions"><button class="secondary" data-close="library-tag-dialog">跳过</button><button class="primary" id="library-tag-save">保存</button></div>
  </dialog>
  <dialog id="library-tag-manager">
    <div class="dialog-title"><h2>管理标签</h2><button type="button" class="icon-button" data-close="library-tag-manager" aria-label="关闭">×</button></div>
    <label for="library-tag-source">标签</label><select id="library-tag-source"></select>
    <label for="library-tag-rename">名称</label><div class="tag-create"><input id="library-tag-rename" maxlength="60"><button class="secondary" id="library-tag-rename-save">改名</button></div>
    <label for="library-tag-target">合并到</label><div class="tag-create"><select id="library-tag-target"></select><button class="secondary" id="library-tag-merge-save">合并</button></div>
    <p id="library-tag-manager-error" class="form-error" role="status"></p><div class="dialog-actions"><button class="primary" data-close="library-tag-manager">完成</button></div>
  </dialog>
  <dialog id="add-dialog">
    <form id="source-form">
      <div class="dialog-title"><h2>添加订阅</h2><button type="button" class="icon-button" data-close="add-dialog" aria-label="关闭">×</button></div>
      <div class="segmented" id="add-platform-tabs" role="tablist" aria-label="平台">
        <button type="button" class="segmented-item" data-add-platform="x" role="tab">X</button>
        <button type="button" class="segmented-item" data-add-platform="xiaohongshu" role="tab">小红书</button>
        <button type="button" class="segmented-item" data-add-platform="wechat" role="tab">公众号</button>
      </div>
      <select id="source-platform" name="platform" hidden><option value="x">X</option><option value="xiaohongshu">小红书</option></select>

      <div id="pane-author">
        <label>名称<input name="name" id="source-name" placeholder="例如：NASA" maxlength="80"></label>
        <label><span id="url-label">主页链接</span><input type="url" name="url" id="source-url" placeholder="https://x.com/NASA"></label>
        <label id="source-interval-field">更新频率<select name="intervalMinutes" id="source-interval"><option value="15">每 15 分钟</option><option value="30" selected>每 30 分钟</option><option value="60">每 1 小时</option><option value="120">每 2 小时</option></select></label>
        <p class="form-note" id="source-note"></p>
        <p class="form-error" id="source-error" role="alert"></p>
      </div>

      <div id="pane-wechat" hidden>
        <div id="wechat-search-form" class="wx-search-form">
          <input id="wechat-search-input" placeholder="搜索公众号名称，例如：花叔" maxlength="40" autocomplete="off">
          <button class="primary" id="wechat-search-submit" type="button">搜索</button>
        </div>
        <p class="form-note" id="wechat-search-note"></p>
        <div id="wechat-search-results" class="wx-results"></div>
        <p class="form-error" id="wechat-search-error" role="alert"></p>
      </div>

      <div class="dialog-actions"><button type="button" class="secondary" data-close="add-dialog">取消</button><button class="primary" id="source-submit" type="submit">添加</button></div>
    </form>
  </dialog>

  <dialog id="source-delete-dialog">
    <div class="dialog-title"><h2>删除订阅？</h2><button type="button" class="icon-button" data-close="source-delete-dialog" aria-label="关闭">×</button></div>
    <p id="source-delete-name"></p><p class="form-note">已保存的内容会保留。</p>
    <p id="source-delete-error" class="form-error" role="alert"></p>
    <div class="dialog-actions"><button type="button" class="secondary" data-close="source-delete-dialog">取消</button><button type="button" class="danger-button" id="source-delete-confirm">删除订阅</button></div>
  </dialog>

  <dialog id="setup-dialog">
    <div class="dialog-title"><h2>连接设置</h2><button class="icon-button" data-close="setup-dialog" aria-label="关闭">×</button></div>
    <div class="platform-runtime" id="platform-runtime"></div>
    <details class="setup-section setup-advanced"><summary>扩展连接</summary><div class="setup-section"><label>扩展目录</label><code id="extension-path"></code></div><div class="setup-section"><label for="bridge-key">配对码</label><div class="key-row"><input id="bridge-key" type="password" readonly><button class="secondary" id="copy-key">复制</button></div></div></details>
    <div class="setup-section"><div class="runtime-row"><span id="extension-version"></span><button class="secondary" id="notification-test">测试通知</button></div><p id="extension-reload" hidden>扩展待刷新</p><p id="notification-status" role="status"></p></div>
    <div class="setup-rss" hidden><a href="http://127.0.0.1:47822/" target="_blank" rel="noopener noreferrer">连接公众号 ↗</a></div>
    <div class="setup-export"><a href="./api/export" download>导出已保存内容 ↗</a></div>
    <button class="primary full-width" data-close="setup-dialog">完成</button>
  </dialog>
  <div id="toast" role="status" hidden></div>
</body>
</html>
